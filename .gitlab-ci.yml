# GitLab CI/CD Pipeline for Anchor of Christ International Ministries

stages:
  - test
  - build
  - security
  - deploy-staging
  - deploy-production

variables:
  REGISTRY: registry.gitlab.com
  IMAGE_NAME: $CI_PROJECT_PATH
  IMAGE_TAG: $CI_COMMIT_SHA
  IMAGE_LATEST: $REGISTRY/$IMAGE_NAME:latest
  IMAGE_FULL: $REGISTRY/$IMAGE_NAME:$IMAGE_TAG

# Templates
.docker_login: &docker_login
  - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY

.node_setup: &node_setup
  image: node:22-alpine
  before_script:
    - npm install -g pnpm@10.4.1
    - pnpm install --frozen-lockfile

# ============================================
# Test Stage
# ============================================

lint:
  <<: *node_setup
  stage: test
  script:
    - pnpm run lint --max-warnings 0
  allow_failure: true

type-check:
  <<: *node_setup
  stage: test
  script:
    - pnpm run check

build-check:
  <<: *node_setup
  stage: test
  script:
    - pnpm run build
  artifacts:
    paths:
      - dist/
    expire_in: 1 hour

security-audit:
  <<: *node_setup
  stage: test
  script:
    - pnpm audit --audit-level=moderate
  allow_failure: true

# ============================================
# Build Stage
# ============================================

build-docker:
  image: docker:24
  services:
    - docker:24-dind
  stage: build
  before_script:
    - *docker_login
  script:
    - docker build -f Dockerfile -t $IMAGE_FULL -t $IMAGE_LATEST .
    - docker push $IMAGE_FULL
    - docker push $IMAGE_LATEST
  only:
    - main
    - develop
    - tags

build-docker-prod:
  image: docker:24
  services:
    - docker:24-dind
  stage: build
  before_script:
    - *docker_login
  script:
    - docker build -f Dockerfile.prod -t $IMAGE_FULL-prod -t $REGISTRY/$IMAGE_NAME:prod .
    - docker push $IMAGE_FULL-prod
    - docker push $REGISTRY/$IMAGE_NAME:prod
  only:
    - tags

# ============================================
# Security Stage
# ============================================

trivy-scan:
  image: aquasec/trivy:latest
  stage: security
  script:
    - trivy image --exit-code 0 --severity HIGH,CRITICAL $IMAGE_FULL
  allow_failure: true
  only:
    - main
    - develop
    - tags

container-scan:
  image: registry.gitlab.com/gitlab-org/security-products/container-scanning:latest
  stage: security
  variables:
    CS_IMAGE: $IMAGE_FULL
  allow_failure: true
  only:
    - main
    - develop
    - tags

# ============================================
# Deploy to Staging
# ============================================

deploy-staging:
  image: alpine:latest
  stage: deploy-staging
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$STAGING_SSH_KEY" | base64 -d | ssh-add -
    - mkdir -p ~/.ssh
    - ssh-keyscan -H $STAGING_HOST >> ~/.ssh/known_hosts
  script:
    - ssh $STAGING_USER@$STAGING_HOST "
        cd /app/anchor-of-christ &&
        docker pull $IMAGE_FULL &&
        docker-compose -f docker-compose.prod.yml down &&
        docker-compose -f docker-compose.prod.yml up -d &&
        docker system prune -f
      "
    - echo "Deployment to staging completed"
  environment:
    name: staging
    url: https://staging.anchor-of-christ.com
  only:
    - develop
  when: manual

# Smoke tests for staging
smoke-test-staging:
  image: curlimages/curl:latest
  stage: deploy-staging
  script:
    - |
      for i in {1..30}; do
        if curl -f https://staging.anchor-of-christ.com/; then
          echo "Staging is healthy!"
          exit 0
        fi
        echo "Attempt $i/30 failed, retrying..."
        sleep 10
      done
      echo "Staging health check failed!"
      exit 1
  only:
    - develop
  when: on_success
  needs: ["deploy-staging"]

# ============================================
# Deploy to Production
# ============================================

deploy-production:
  image: alpine:latest
  stage: deploy-production
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$PROD_SSH_KEY" | base64 -d | ssh-add -
    - mkdir -p ~/.ssh
    - ssh-keyscan -H $PROD_HOST >> ~/.ssh/known_hosts
  script:
    - ssh $PROD_USER@$PROD_HOST "
        cd /app/anchor-of-christ &&
        docker pull $IMAGE_FULL &&
        docker-compose -f docker-compose.prod.yml down &&
        docker-compose -f docker-compose.prod.yml up -d &&
        docker system prune -f
      "
    - echo "Deployment to production completed"
  environment:
    name: production
    url: https://anchor-of-christ.com
  only:
    - tags
  when: manual

# Health check for production
health-check-production:
  image: curlimages/curl:latest
  stage: deploy-production
  script:
    - |
      for i in {1..30}; do
        if curl -f https://anchor-of-christ.com/health; then
          echo "Production is healthy!"
          exit 0
        fi
        echo "Attempt $i/30 failed, retrying..."
        sleep 10
      done
      echo "Production health check failed!"
      exit 1
  only:
    - tags
  when: on_success
  needs: ["deploy-production"]

# ============================================
# Rollback Job
# ============================================

rollback-production:
  image: alpine:latest
  stage: deploy-production
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$PROD_SSH_KEY" | base64 -d | ssh-add -
    - mkdir -p ~/.ssh
    - ssh-keyscan -H $PROD_HOST >> ~/.ssh/known_hosts
  script:
    - ssh $PROD_USER@$PROD_HOST "
        cd /app/anchor-of-christ &&
        docker-compose -f docker-compose.prod.yml down &&
        docker pull $REGISTRY/$IMAGE_NAME:previous &&
        docker-compose -f docker-compose.prod.yml up -d
      "
    - echo "Rollback completed"
  environment:
    name: production
    action: rollback
  only:
    - tags
  when: manual
