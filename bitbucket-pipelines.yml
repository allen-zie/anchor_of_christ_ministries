# Bitbucket Pipelines configuration for Anchor of Christ International Ministries

image: node:22-alpine

definitions:
  caches:
    pnpm: ~/.pnpm-store

  steps:
    - step: &lint
        name: Lint & Format
        script:
          - npm install -g pnpm@10.4.1
          - pnpm install --frozen-lockfile
          - pnpm run lint --max-warnings 0
        after-script:
          - |
            if [ $? -ne 0 ]; then
              echo "Linting failed"
            fi

    - step: &type-check
        name: Type Check
        script:
          - npm install -g pnpm@10.4.1
          - pnpm install --frozen-lockfile
          - pnpm run check

    - step: &build
        name: Build Application
        script:
          - npm install -g pnpm@10.4.1
          - pnpm install --frozen-lockfile
          - pnpm run build
        artifacts:
          - dist/**

    - step: &security-audit
        name: Security Audit
        script:
          - npm install -g pnpm@10.4.1
          - pnpm install --frozen-lockfile
          - pnpm audit --audit-level=moderate
        after-script:
          - |
            if [ $? -ne 0 ]; then
              echo "Security audit found issues"
            fi

    - step: &docker-build
        name: Build Docker Image
        image: atlassian/default-image:2
        services:
          - docker
        script:
          - docker login -u $DOCKER_USERNAME -p $DOCKER_PASSWORD
          - docker build -f Dockerfile -t $DOCKER_REGISTRY/$DOCKER_IMAGE:$BITBUCKET_COMMIT .
          - docker push $DOCKER_REGISTRY/$DOCKER_IMAGE:$BITBUCKET_COMMIT
          - docker tag $DOCKER_REGISTRY/$DOCKER_IMAGE:$BITBUCKET_COMMIT $DOCKER_REGISTRY/$DOCKER_IMAGE:latest
          - docker push $DOCKER_REGISTRY/$DOCKER_IMAGE:latest

    - step: &docker-build-prod
        name: Build Production Docker Image
        image: atlassian/default-image:2
        services:
          - docker
        script:
          - docker login -u $DOCKER_USERNAME -p $DOCKER_PASSWORD
          - docker build -f Dockerfile.prod -t $DOCKER_REGISTRY/$DOCKER_IMAGE:$BITBUCKET_TAG .
          - docker push $DOCKER_REGISTRY/$DOCKER_IMAGE:$BITBUCKET_TAG

    - step: &security-scan
        name: Security Scan
        image: aquasec/trivy:latest
        script:
          - trivy image --exit-code 0 --severity HIGH,CRITICAL $DOCKER_REGISTRY/$DOCKER_IMAGE:$BITBUCKET_COMMIT

    - step: &deploy-staging
        name: Deploy to Staging
        image: atlassian/default-image:2
        script:
          - apt-get update && apt-get install -y openssh-client
          - mkdir -p ~/.ssh
          - echo $STAGING_SSH_KEY | base64 -d > ~/.ssh/id_rsa
          - chmod 600 ~/.ssh/id_rsa
          - ssh-keyscan -H $STAGING_HOST >> ~/.ssh/known_hosts
          - |
            ssh $STAGING_USER@$STAGING_HOST "
              cd /app/anchor-of-christ &&
              docker pull $DOCKER_REGISTRY/$DOCKER_IMAGE:$BITBUCKET_COMMIT &&
              docker-compose -f docker-compose.prod.yml down &&
              docker-compose -f docker-compose.prod.yml up -d &&
              docker system prune -f
            "

    - step: &smoke-test-staging
        name: Smoke Test Staging
        image: curlimages/curl:latest
        script:
          - |
            for i in {1..30}; do
              if curl -f https://staging.anchor-of-christ.com/; then
                echo "Staging is healthy!"
                exit 0
              fi
              echo "Attempt $i/30 failed, retrying..."
              sleep 10
            done
            echo "Staging health check failed!"
            exit 1

    - step: &deploy-production
        name: Deploy to Production
        image: atlassian/default-image:2
        script:
          - apt-get update && apt-get install -y openssh-client
          - mkdir -p ~/.ssh
          - echo $PROD_SSH_KEY | base64 -d > ~/.ssh/id_rsa
          - chmod 600 ~/.ssh/id_rsa
          - ssh-keyscan -H $PROD_HOST >> ~/.ssh/known_hosts
          - |
            ssh $PROD_USER@$PROD_HOST "
              cd /app/anchor-of-christ &&
              docker pull $DOCKER_REGISTRY/$DOCKER_IMAGE:$BITBUCKET_TAG &&
              docker-compose -f docker-compose.prod.yml down &&
              docker-compose -f docker-compose.prod.yml up -d &&
              docker system prune -f
            "

    - step: &health-check-production
        name: Health Check Production
        image: curlimages/curl:latest
        script:
          - |
            for i in {1..30}; do
              if curl -f https://anchor-of-christ.com/health; then
                echo "Production is healthy!"
                exit 0
              fi
              echo "Attempt $i/30 failed, retrying..."
              sleep 10
            done
            echo "Production health check failed!"
            exit 1

pipelines:
  default:
    - step: *lint
    - step: *type-check
    - step: *build
    - step: *security-audit

  branches:
    develop:
      - step: *lint
      - step: *type-check
      - step: *build
      - step: *security-audit
      - step: *docker-build
      - step: *security-scan
      - step: *deploy-staging
      - step: *smoke-test-staging

    main:
      - step: *lint
      - step: *type-check
      - step: *build
      - step: *security-audit
      - step: *docker-build
      - step: *security-scan

  tags:
    'v*':
      - step: *lint
      - step: *type-check
      - step: *build
      - step: *security-audit
      - step: *docker-build-prod
      - step: *security-scan
      - step: *deploy-production
      - step: *health-check-production

  pull-requests:
    '**':
      - step: *lint
      - step: *type-check
      - step: *build
      - step: *security-audit
